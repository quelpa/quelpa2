name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version:
          - "29.1"
          - "29.4"
          - "30.1"
          - "snapshot"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Verify Emacs Version
        run: emacs --version

      - name: Run ERT Test Suite
        run: emacs -Q -batch -L . -l test/quelpa2-test.el -f ert-run-tests-batch-and-exit
