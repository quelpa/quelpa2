name: Nightly Real-World Tests

on:
  schedule:
    - cron: '0 4 * * *' # Runs every day at 4:00 AM UTC
  workflow_dispatch:     # Allows you to trigger it manually from GitHub's UI anytime

jobs:
  real-world-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "29.1"

      - name: Run ERT Tests with Network Enabled
        env:
          RUN_NETWORK_TESTS: "1"
        run: emacs -Q -batch -L . -l test/quelpa2-test.el -f ert-run-tests-batch-and-exit
